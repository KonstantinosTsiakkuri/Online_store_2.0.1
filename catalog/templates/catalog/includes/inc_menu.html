{% comment %}Главное меню сайта. Описано только здесь, на страницы попадает через include.{% endcomment %}
<div class="bg-dark text-white rounded p-3 h-100">
    <p class="fw-bold">Меню</p>
    <ul class="nav flex-column mb-3">
        <li class="nav-item">
            <a class="nav-link text-white px-0" href="{% url 'catalog:home' %}">Главная</a>
        </li>
        <li class="nav-item">
            <a class="nav-link text-white px-0" href="#">Категории</a>
        </li>
        <li class="nav-item">
            <a class="nav-link text-white px-0" href="#">Заказы</a>
        </li>
        <li class="nav-item">
            <a class="nav-link text-white px-0" href="{% url 'catalog:contacts' %}">Контакты</a>
        </li>
        <li class="nav-item">
            <a class="nav-link text-white px-0" href="{% url 'blog:post_list' %}">Блог</a>
        </li>
    </ul>
    {% if user.is_authenticated %}
        <div class="dropdown">
            <button class="btn btn-outline-light btn-sm dropdown-toggle" data-bs-toggle="dropdown">
                {{ user.email }}
            </button>
            <ul class="dropdown-menu">
                <li>
                    <form method="post" action="{% url 'users:logout' %}" class="px-3 py-1">
                        {% csrf_token %}
                        <button type="submit" class="btn btn-link dropdown-item-text p-0">Выход</button>
                    </form>
                </li>
            </ul>
        </div>
    {% else %}
        <div class="d-grid gap-2">
            <a href="{% url 'users:login' %}" class="btn btn-outline-light btn-sm">Вход</a>
            <a href="{% url 'users:register' %}" class="btn btn-outline-light btn-sm">Регистрация</a>
        </div>
    {% endif %}
</div>
