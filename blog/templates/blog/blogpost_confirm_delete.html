{% extends "catalog/base.html" %}

{% block title %}Удаление статьи{% endblock %}

{% block content %}
    <h1 class="mb-4">Удаление статьи</h1>

    <div class="card">
        <div class="card-body">
            <p>Вы уверены, что хотите удалить статью «{{ object.title }}»? Это действие необратимо.</p>
            <form method="post">
                {% csrf_token %}
                <button type="submit" class="btn btn-danger">Да, удалить</button>
                <a href="{% url 'blog:post_detail' object.pk %}" class="btn btn-outline-secondary">Отмена</a>
            </form>
        </div>
    </div>
{% endblock %}
