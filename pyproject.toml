[project]
name = "online-project-full"
version = "0.1.0"
description = ""
authors = [
    {name = "olasp",email = "olaspain@BK.RU"}
]
readme = "README.md"
requires-python = "^3.13"
dependencies = [
    "django (>=5,<6)",
    "psycopg2-binary (>=2.9.13,<3.0.0)",
    "python-dotenv (>=1.2.3,<2.0.0)",
    "pillow (>=12.3.0,<13.0.0)",
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.group.dev.dependencies]
black = "^26.5.1"
isort = "^9.0.1"
mypy = "^2.3.1"
flake8 = "^7.3.0"
ipython = "^9.17.1"


[tool.black]
line-length = 119
target-version = ["py313"]
extend-exclude = "/migrations/"

[tool.isort]
profile = "black"
line_length = 119
extend_skip_glob = ["*/migrations/*"]

[tool.mypy]
python_version = "3.13"
ignore_missing_imports = true
disallow_untyped_defs = false
exclude = ["migrations"]

[[tool.mypy.overrides]]
module = ["django.*"]
ignore_missing_imports = true

