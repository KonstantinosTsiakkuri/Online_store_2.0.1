[project]
name = "online-project-full"
version = "0.1.0"
description = ""
authors = [
    {name = "olasp",email = "olaspain@BK.RU"}
]
readme = "README.md"
requires-python = "^3.13"
dependencies = [
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.group.dev.dependencies]
black = "^26.5.1"
isort = "^9.0.1"
mypy = "^2.3.1"
flake8 = "^7.3.0"


[tool.black]
line-length = 119
target-version = ["py313"]

[tool.isort]
profile = "black"
line_length = 119

[tool.mypy]
python_version = "3.13"
ignore_missing_imports = true
disallow_untyped_defs = false

